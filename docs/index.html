<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peter Research · 皮特的调研</title>
<meta name="description" content="Self-hosted 6-module market dashboard. No Yahoo. Free data only.">
<style>
:root{
  --bg:#0b0e14; --panel:#141922; --panel2:#1b2230; --line:#242c3a;
  --txt:#e6edf6; --dim:#8b98ad; --dim2:#5f6b7e;
  --up:#26c281; --down:#ff4d4f;           /* 国际主流：涨绿 跌红 */
  --ok:#26c281; --bad:#ff4d4f; --warn:#e3b341;   /* 语义色：好 / 坏 / 警示（与涨跌解耦） */
  --gold:#e3b341; --blue:#4d9fff; --violet:#a371f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.brand{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand span{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.pill.live{color:var(--ok);border-color:#1d4d3c}
.pill.stale{color:var(--gold);border-color:#4d431d}
.spacer{flex:1}
button.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
button.btn:hover{border-color:#3a465c}

/* ---------- nav ---------- */
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
nav button{background:transparent;color:var(--dim);border:1px solid transparent;
  padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
nav button:hover{color:var(--txt);background:var(--panel)}
nav button.on{background:var(--panel);color:var(--txt);border-color:var(--line)}

/* ---------- layout ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600}
.card .sub{color:var(--dim2);font-size:12px;margin-bottom:12px}
.kpi{font-size:30px;font-weight:700;line-height:1.1}
.kpi.sm{font-size:22px}
.hint{color:var(--dim2);font-size:11px;margin-top:10px;line-height:1.5}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--dim2);font-weight:500;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;padding:8px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid #1a2130;text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#171d28}
.sym{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}

/* ---------- bars / badges ---------- */
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.sub-row{display:grid;grid-template-columns:80px 1fr 42px;gap:10px;align-items:center;margin:9px 0}
.sub-row b{font-weight:500;color:var(--dim);font-size:12px}
.sub-row s{text-decoration:none;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge.ok{background:#12301f;color:#3ddc84;border:1px solid #1e5636}
.badge.no{background:#3a1418;color:#ff6b6b;border:1px solid #5a2230}
.b-healthy{background:#12301f;color:#3ddc84}
.b-watch{background:#33290f;color:var(--gold)}
.b-weak{background:#331d0f;color:#ff9f45}
.b-reduce{background:#3a1418;color:#ff6b6b}
.b-lead{background:#12301f;color:#3ddc84}
.b-weaken{background:#33290f;color:var(--gold)}
.b-lag{background:#3a1418;color:#ff7b7b}
.b-improve{background:#122a3a;color:#5bb8ff}
.score{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px;font-weight:700;font-size:12px}

/* ---------- misc ---------- */
.rowline{display:flex;justify-content:space-between;padding:6px 0;
  border-bottom:1px solid #1a2130;font-size:13px}
.rowline:last-child{border-bottom:none}
.rowline span:first-child{color:var(--dim)}
.notice{background:#161d2a;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:8px;padding:12px 14px;color:var(--dim);font-size:12.5px;line-height:1.6}
footer{color:var(--dim2);font-size:11.5px;text-align:center;padding:24px 0 12px;line-height:1.7}
.hidden{display:none}
.loading{text-align:center;padding:70px 0;color:var(--dim)}
.mtab{padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-size:12px}
.mtab.on{background:var(--blue);color:#0b0e14;border-color:var(--blue);font-weight:600}
.evstrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.evchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px}
.evchip i{font-style:normal;color:var(--dim2);font-size:11px}
.evchip i.hot{color:var(--bad);font-weight:600}
.b-ok{background:#12301f;color:#3ddc84}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"▸ ";color:var(--dim)}
details.card[open] summary::before{content:"▾ "}
code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
button.btn:disabled{opacity:.55;cursor:progress}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">Peter Research<span>皮特的调研 · 多源信号看盘</span></div>
    <div class="pill" id="stamp">载入中…</div>
    <div class="pill" id="freshness">—</div>
    <div class="spacer"></div>
    <button class="btn" id="refresh">刷新</button>
  </header>

  <nav id="nav"></nav>
  <div id="app"><div class="loading">正在拉取快照…</div></div>

  <footer>
    数据源：stockanalysis.com · api.nasdaq.com · api.worldbank.org　|　<b>不使用 Yahoo / yfinance</b><br>
    配色口径：<span class="up">涨绿</span> / <span class="down">跌红</span>（国际主流，与 TradingView / Bloomberg 一致）<br>
    全部为公开免费数据的机械计算结果，非投资建议；是否操作由你本人决策。
  </footer>
</div>

<script>
/* ============================ helpers ============================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const n2 = (v,d=2)=> (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toFixed(d);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 涨绿跌红（国际主流口径，见 :root --up / --down） */
function pctCls(v){ if(v===null||v===undefined||isNaN(v)) return 'flat'; return v>0?'up':(v<0?'down':'flat'); }
function pct(v,d=2){ if(v===null||v===undefined||isNaN(v)) return '<span class="flat">—</span>';
  const s=(v>0?'+':'')+Number(v).toFixed(d)+'%'; return `<span class="${pctCls(v)}">${s}</span>`; }
function scoreColor(s){ if(s>=85)return '#3ddc84'; if(s>=70)return '#8bd450'; if(s>=50)return '#e3b341';
  if(s>=30)return '#ff9f45'; return '#ff6b6b'; }
function scoreChip(s){ const c=scoreColor(s);
  return `<span class="score" style="background:${c}22;color:${c}">${s}</span>`; }
function healthBadge(h){ const m={'Healthy':'b-healthy','Watch':'b-watch','Weak':'b-weak','REDUCE':'b-reduce'};
  return `<span class="badge ${m[h]||'b-watch'}">${esc(h)}</span>`; }
function quadBadge(q){ const m={'Leading':'b-lead','Weakening':'b-weaken','Lagging':'b-lag','Improving':'b-improve'};
  const cn={'Leading':'领先','Weakening':'走弱','Lagging':'落后','Improving':'改善'};
  return `<span class="badge ${m[q]||''}">${cn[q]||q}</span>`; }
function subBar(name,val){ const c=scoreColor(val);
  return `<div class="sub-row"><b>${name}</b>
    <div class="bar"><i style="width:${Math.max(2,val)}%;background:${c}"></i></div>
    <s style="color:${c}">${val}</s></div>`; }

/* ============================ state ============================ */
let SNAP=null, PRIV=null, TAB='overview', MACRO_METRIC='infl';
let MOVER_TAB='active', FLOW_TAB='inst';
const TABS=[['overview','总览'],['macro','01 宏观'],['direction','02 方向'],['rotation','03 轮动'],
            ['movers','04 最活跃'],['flow','05 资金·机构'],['rank','06 复合排名'],
            ['vcp','07 VCP融合'],['kova','08 打分'],['discipline','09 纪律'],['proof','10 验证']];

/* ============================ modules ============================ */
function viewOverview(s){
  const d=s.direction, r=s.rotation, c=r.counts||{};
  const lev=(s.leveraged||[]).slice().sort((a,b)=>b.score-a.score);
  const top=(s.kova.rows||[]).slice(0,8);
  return `
  <div class="grid g3">
    <div class="card">
      <h3>市场姿态 Posture</h3><div class="sub">${esc(d.label)} · ${esc(d.tone)}</div>
      <div class="kpi" style="color:${scoreColor(d.posture)}">${d.posture}<span style="font-size:14px;color:var(--dim2)"> / 100</span></div>
      <div style="margin-top:14px">${Object.entries(d.subs).map(([k,v])=>subBar(k,v)).join('')}</div>
    </div>
    <div class="card">
      <h3>板块轮动分布</h3><div class="sub">11 个 SPDR 行业 vs ${esc(r.bench||'SPY')}</div>
      <div class="rowline"><span>领先 Leading</span><b class="up">${c.Leading||0}</b></div>
      <div class="rowline"><span>改善 Improving</span><b style="color:var(--blue)">${c.Improving||0}</b></div>
      <div class="rowline"><span>走弱 Weakening</span><b style="color:var(--gold)">${c.Weakening||0}</b></div>
      <div class="rowline"><span>落后 Lagging</span><b class="down">${c.Lagging||0}</b></div>
      <div class="hint">四象限按 JdK RS-Ratio / RS-Momentum 划分，顺时针漂移：改善→领先→走弱→落后。</div>
    </div>
    <div class="card">
      <h3>杠杆 ETF 轮动池</h3><div class="sub">你的实盘策略标的池打分</div>
      <table><tbody>${lev.map(x=>`<tr>
        <td class="sym">${esc(x.sym)}</td>
        <td>${pct(x.pct)}</td>
        <td>${scoreChip(x.score)}</td>
        <td>${healthBadge(x.health)}</td></tr>`).join('')}</tbody></table>
      <div class="hint">分数 = 趋势 + 动量 + 相对强弱 + 距高点 + 量能，机械计算、可复核。</div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <h3>大盘与风险偏好</h3><div class="sub">收盘 · ${esc((d.tape[0]||{}).asof||'')}</div>
      <table><thead><tr><th>标的</th><th>价格</th><th>日涨跌</th><th>1M</th><th>3M</th><th>vs MA50</th></tr></thead>
      <tbody>${d.tape.map(t=>{
        const rel = (t.price&&t.ma50)? (t.price/t.ma50-1)*100 : null;
        return `<tr><td class="sym">${esc(t.sym)}</td><td>${n2(t.price)}</td>
        <td>${pct(t.pct)}</td><td>${pct(t.r1m,1)}</td><td>${pct(t.r3m,1)}</td><td>${pct(rel,1)}</td></tr>`;}).join('')}
      </tbody></table>
    </div>
    <div class="card">
      <h3>观察池评分 Top 8</h3><div class="sub">共 ${(s.kova.rows||[]).length} 只</div>
      <table><thead><tr><th>标的</th><th>价格</th><th>日</th><th>3M vs SPY</th><th>分</th><th>状态</th></tr></thead>
      <tbody>${top.map(x=>`<tr><td class="sym">${esc(x.sym)}</td><td>${n2(x.price)}</td>
        <td>${pct(x.pct)}</td><td>${pct(x.rel_spy_3m,1)}</td>
        <td>${scoreChip(x.score)}</td>      <td>${healthBadge(x.health)}</td></tr>`).join('')}</tbody></table>
    </div>
  </div>

  ${(()=>{ const top=((s.composite||{}).rows||[]).slice(0,10); if(!top.length) return '';
    return `<div class="card" style="margin-top:14px"><h3>今日重点 · 复合信号排名 Top 10</h3>
      <div class="sub">多源融合（技术+活跃+资金+机构+论点）· <a href="javascript:void(0)" onclick="TAB='rank';location.hash='rank';renderNav();renderBody()">看完整排名 →</a></div>
      <table><thead><tr><th>标的</th><th>价格</th><th>日</th><th>分数</th><th>状态</th><th>为什么高亮</th></tr></thead>
      <tbody>${top.map(x=>`<tr><td class="sym">${esc(x.sym)}</td><td>${n2(x.price)}</td>
        <td>${pct(x.pct)}</td><td>${scoreChip(x.score)}</td>
        <td>${healthBadge(x.health)}</td>
        <td style="text-align:left;max-width:440px"><span style="display:inline-flex;flex-wrap:wrap;gap:4px">
          ${x.why.map(w=>`<span class="evchip" style="padding:2px 8px;margin:0">${esc(w)}</span>`).join('')||'<span class="flat">—</span>'}</span></td></tr>`).join('')}</tbody></table>
    </div>`; })()}
`
}

function worldMapSVG(items, metric){
  const W=680,H=340,P=10;
  const X=v=>P+(v+180)/360*(W-2*P);
  const Y=v=>(90-v)/180*(H-2*P)+P;
  const tierColor=t=>({hot:'#ff4d4f',warm:'#ff9f45',normal:'#e3b341',cool:'#4d9fff',cold:'#8b9dff'}[t]||'#8b98ad');
  const vals=items.map(x=> x[metric]!=null?Math.abs(x[metric]):0);
  const mx=Math.max(...vals,1);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:${W}px;margin:0 auto">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0b0e14" stroke="#222b3a"/>
    <line x1="0" y1="${Y(0).toFixed(1)}" x2="${W}" y2="${Y(0).toFixed(1)}" stroke="#1c2433"/>
    <line x1="${X(0).toFixed(1)}" y1="0" x2="${X(0).toFixed(1)}" y2="${H}" stroke="#1c2433"/>`;
  for(const it of items){
    const v=it[metric]; if(v==null) continue;
    const x=X(it.lng), y=Y(it.lat);
    const r=4+Math.min(Math.abs(v)/mx,1)*9;
    const col= metric==='gdp' ? (v>=3?'#3ddc84':v>=1?'#e3b341':'#8b98ad') : tierColor(it.tier);
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" opacity=".82" stroke="#0b0e14" stroke-width=".5">
      <title>${esc(it.name)} ${metric==='gdp'?'GDP ':'CPI '}${v}%</title></circle>`;
  }
  g+=`<text x="8" y="15" fill="#5f6b7e" font-size="11">世界宏观气泡图 · 圆点大小∝幅度</text></svg>`;
  return g;
}

function viewMacro(s){
  const m=s.macro, items=(m.items||[]).slice().sort((a,b)=>b.infl-a.infl);
  const metric=window.MACRO_METRIC||'infl';
  const tierColor=t=>({hot:'#ff4d4f',warm:'#ff9f45',normal:'#e3b341',cool:'#4d9fff',cold:'#8b9dff'}[t]||'#8b98ad');
  const max=Math.max(...items.map(x=>Math.min(x.infl,20)),1);
  const gdpBtn=`<button class="mtab ${metric==='gdp'?'on':''}" onclick="MACRO_METRIC='gdp';renderBody()">GDP 增速</button>`;
  const inflBtn=`<button class="mtab ${metric==='infl'?'on':''}" onclick="MACRO_METRIC='infl';renderBody()">通胀 CPI</button>`;
  const hiList= metric==='gdp'?(m.gdp_highest||[]):(m.hottest||[]);
  const loList= metric==='gdp'?(m.gdp_lowest||[]):(m.coolest||[]);
  const hiVal= x=> metric==='gdp'? x.gdp : x.infl;
  const hiYr= x=> metric==='gdp'? x.gdp_year : x.year;
  return `
  <div class="card"><div class="sub" style="display:flex;justify-content:space-between;align-items:center">
    <b>全球宏观地图</b><span>${inflBtn}${gdpBtn}</span></div>
    ${worldMapSVG(items, metric)}
    <div class="hint">${esc(m.source||'World Bank')} · 共 ${items.length} 个经济体。通胀按五档着色（hot&gt;10% / warm 5–10% / normal 3–5% / cool 1–3% / cold&lt;1%）；GDP 按增速着色。年份为最新可得年度。</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>${metric==='gdp'?'GDP 最高':'通胀最高'}</h3><div class="sub">World Bank ${metric==='gdp'?'GDP 年率':'CPI 年率'}</div>
      <table><tbody>${hiList.map(x=>`<tr><td class="sym">${esc(x.name)}</td>
        <td class="up">${n2(hiVal(x))}%</td><td style="color:var(--dim2)">${esc(hiYr(x))}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h3>${metric==='gdp'?'GDP 最低':'通胀最低'}</h3><div class="sub">World Bank ${metric==='gdp'?'GDP 年率':'CPI 年率'}</div>
      <table><tbody>${loList.map(x=>`<tr><td class="sym">${esc(x.name)}</td>
        <td class="down">${n2(hiVal(x))}%</td><td style="color:var(--dim2)">${esc(hiYr(x))}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>全球通胀热度（列表）</h3><div class="sub">共 ${items.length} 个经济体（条形上限 20% 便于比较）</div>
    ${items.map(x=>{
      const w=Math.max(2,Math.min(x.infl,20)/max*100), c=tierColor(x.tier);
      return `<div class="sub-row" style="grid-template-columns:130px 1fr 78px">
        <b>${esc(x.name)}</b><div class="bar"><i style="width:${w}%;background:${c}"></i></div>
        <s style="color:${c}">${n2(x.infl)}%</s></div>`;}).join('')}
  </div>`;
}

function viewDirection(s){
  const d=s.direction, x=d.detail||{};
  return `
  <div class="grid g2">
    <div class="card">
      <h3>综合姿态</h3><div class="sub">${esc(d.label)} · ${esc(d.tone)}</div>
      <div class="kpi" style="color:${scoreColor(d.posture)}">${d.posture}</div>
      <div style="margin-top:16px">${Object.entries(d.subs).map(([k,v])=>subBar(k,v)).join('')}</div>
      <div class="hint">${esc(d.method||'')}</div>
    </div>
    <div class="card">
      <h3>计算依据（可复核）</h3><div class="sub">全部为公开数据的机械口径</div>
      <div class="rowline"><span>SPY 现价</span><b>${n2(x.spy_px)}</b></div>
      <div class="rowline"><span>MA20 / MA50 / MA200</span><b>${n2(x.ma20)} / ${n2(x.ma50)} / ${n2(x.ma200)}</b></div>
      <div class="rowline"><span>宽度：站上 MA50 的样本</span><b>${x.breadth_above} / ${x.breadth_total}</b></div>
      <div class="rowline"><span>20 日已实现波动率</span><b>${n2(x.realized_vol_20d,1)}%</b></div>
      <div class="rowline"><span>信用：HYG/IEF 近 1 月</span><b class="${pctCls((x.credit||{}).hyg_ief_roc_1m)}">${n2((x.credit||{}).hyg_ief_roc_1m)}%</b></div>
      <div class="rowline"><span>领涨：QQQ − SPY (1M)</span><b class="${pctCls((x.leadership||{}).qqq_vs_spy_1m)}">${n2((x.leadership||{}).qqq_vs_spy_1m)}pp</b></div>
      <div class="rowline"><span>领涨：IWM − SPY (1M)</span><b class="${pctCls((x.leadership||{}).iwm_vs_spy_1m)}">${n2((x.leadership||{}).iwm_vs_spy_1m)}pp</b></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>大盘 / 利率 / 信用 / 加密</h3><div class="sub">收盘 · ${esc((d.tape[0]||{}).asof||'')}</div>

/* ---- RRG: hand-rolled SVG, no chart library ---- */
function rrgSvg(sectors){
  const W=680,H=520,P=52;
  const xs=sectors.flatMap(s=>s.tail.map(p=>p[0])).concat(sectors.map(s=>s.rs_ratio));
  const ys=sectors.flatMap(s=>s.tail.map(p=>p[1])).concat(sectors.map(s=>s.rs_mom));
  const pad=0.35;
  let x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad, y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
  const half=Math.max(100-x0,x1-100,0.8); x0=100-half; x1=100+half;
  const halfY=Math.max(100-y0,y1-100,0.8); y0=100-halfY; y1=100+halfY;
  const X=v=>P+(v-x0)/(x1-x0)*(W-2*P), Y=v=>H-P-(v-y0)/(y1-y0)*(H-2*P);
  const cx=X(100), cy=Y(100);
  const qc={Leading:'#3ddc84',Weakening:'#e3b341',Lagging:'#ff6b6b',Improving:'#4d9fff'};
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:0 auto">
    <rect x="${cx}" y="${P}" width="${W-P-cx}" height="${cy-P}" fill="#26c281" opacity=".05"/>
    <rect x="${cx}" y="${cy}" width="${W-P-cx}" height="${H-P-cy}" fill="#e3b341" opacity=".05"/>
    <rect x="${P}" y="${cy}" width="${cx-P}" height="${H-P-cy}" fill="#ff4d4f" opacity=".05"/>
    <rect x="${P}" y="${P}" width="${cx-P}" height="${cy-P}" fill="#4d9fff" opacity=".05"/>
    <line x1="${P}" y1="${cy}" x2="${W-P}" y2="${cy}" stroke="#3a465c" stroke-width="1"/>
    <line x1="${cx}" y1="${P}" x2="${cx}" y2="${H-P}" stroke="#3a465c" stroke-width="1"/>
    <text x="${W-P-6}" y="${P+16}" fill="#3ddc84" font-size="12" text-anchor="end">领先 Leading</text>
    <text x="${W-P-6}" y="${H-P-6}" fill="#e3b341" font-size="12" text-anchor="end">走弱 Weakening</text>
    <text x="${P+6}" y="${H-P-6}" fill="#ff7b7b" font-size="12">落后 Lagging</text>
    <text x="${P+6}" y="${P+16}" fill="#5bb8ff" font-size="12">改善 Improving</text>
    <text x="${W/2}" y="${H-14}" fill="#5f6b7e" font-size="11" text-anchor="middle">RS-Ratio（相对强弱）→</text>
    <text x="16" y="${H/2}" fill="#5f6b7e" font-size="11" transform="rotate(-90 16 ${H/2})" text-anchor="middle">RS-Momentum（动量）→</text>`;
  for(const s of sectors){
    const c=qc[s.quadrant]||'#8b98ad';
    const pts=s.tail.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" opacity=".45"/>`;
    s.tail.slice(0,-1).forEach(p=>{ g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2" fill="${c}" opacity=".35"/>`; });
    const px=X(s.rs_ratio), py=Y(s.rs_mom);
    g+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="6" fill="${c}" stroke="#0b0e14" stroke-width="1.5"/>
        <text x="${(px+10).toFixed(1)}" y="${(py+4).toFixed(1)}" fill="${c}" font-size="12" font-weight="600">${esc(s.sym)}</text>`;
  }
  return g+'</svg>';
}

  if(c.length<2) return c.length===1
    ? `<div class="card" style="margin-top:14px"><h3>净值曲线</h3>
        <div class="sub">bridge 目前只记录了 ${c.length} 天，累积到 2 天以上后自动开始绘制</div></div>`
    : '';
  const W=920,H=180,PAD=28;
  const vs=c.map(x=>x.nlv), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const X=i=>PAD+i*(W-2*PAD)/(c.length-1);
  const Y=v=>PAD+(1-(v-lo)/span)*(H-2*PAD);
  const pts=c.map((x,i)=>`${X(i).toFixed(1)},${Y(x.nlv).toFixed(1)}`).join(' ');
  const rising=vs[vs.length-1]>=vs[0];
  const col=rising?'var(--up)':'var(--down)';
  const peak=p.peak_nlv;
  const peakLine=(peak&&peak<=hi&&peak>=lo)
    ? `<line x1="${PAD}" y1="${Y(peak).toFixed(1)}" x2="${W-PAD}" y2="${Y(peak).toFixed(1)}"
        stroke="var(--dim)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
       <text x="${W-PAD}" y="${(Y(peak)-6).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--dim)">峰值 $${Math.round(peak).toLocaleString()}</text>` : '';
  return `<div class="card" style="margin-top:14px"><h3>净值曲线</h3>
    <div class="sub">来自 daily-signal-bridge 的每日 NLV 记录（IBKR 实盘）· 共 ${c.length} 个交易日</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${c.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.nlv).toFixed(1)}" r="2.5" fill="${col}"/>`).join('')}
      ${peakLine}
      <text x="${PAD}" y="14" font-size="10" fill="var(--dim)">$${Math.round(hi).toLocaleString()}</text>
      <text x="${PAD}" y="${H-6}" font-size="10" fill="var(--dim)">$${Math.round(lo).toLocaleString()}</text>
      <text x="${W-PAD}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--dim)">${esc(c[c.length-1].date)}</text>
    </svg></div>`;
}

  <div class="card"><h3>VCP 信号融合 · 每日扫描 × 5 因子系统</h3>
    <div class="sub">扫描日期 ${esc(v.date||'')} · ${esc(v.market||'')} · 池 ${esc(v.pool||'')} · 共 ${v.n} 只 VCP 形态标的　——　VCP 分(形态强度) 与 系统分(技术+活跃+资金+机构+论点) 双维度，先打分、再选买哪个。</div>
    <div class="hint" style="margin-top:6px">买入前10榜 = VCP 形态最强梯队；额外买入前10榜 = 次优梯队。综合 = 0.4×VCP归一 + 0.6×系统分。绿=强(形态+系统双高) / 金=警惕(形态好但系统分低) / 蓝=中(次优) / 红=弱。仅供研究，非投资建议。</div>
    ${buy.length?vcpTable(buy,'买入前10榜 · 形态最强'):'<div class="notice">无买入前10数据</div>'}
    ${ext.length?vcpTable(ext,'额外买入前10榜 · 次优梯队'):''}
    <div class="hint" style="margin-top:10px">${esc(v.method||'')}</div>
  </div>`;
}

/* ============================ sizer ============================ */
function bindSizer(){
  const calc=()=>{
    const eq=+$('#eq').value, rp=+$('#rp').value, ep=+$('#ep').value, sp=+$('#sp').value;
    const out=$('#sizeOut'); if(!out) return;
    const risk=ep-sp;
    if(!(eq>0&&rp>0&&ep>0&&risk>0)){ out.innerHTML=`<div class="notice">止损价必须低于买入价。</div>`; return; }
    const dollarRisk=eq*rp/100, shares=Math.floor(dollarRisk/risk), notional=shares*ep;
    const expo=notional/eq*100;
    out.innerHTML=`<div class="grid g4" style="gap:10px">
      <div class="card" style="padding:12px"><div class="sub">最大股数</div><div class="kpi sm">${shares.toLocaleString()}</div></div>
      <div class="card" style="padding:12px"><div class="sub">占用市值</div><div class="kpi sm">$${Math.round(notional).toLocaleString()}</div></div>
      <div class="card" style="padding:12px"><div class="sub">风险金额 (1R)</div><div class="kpi sm">$${Math.round(dollarRisk).toLocaleString()}</div></div>
      <div class="card" style="padding:12px"><div class="sub">仓位占比</div>
        <div class="kpi sm" style="color:${expo>100?'var(--warn)':'var(--txt)'}">${expo.toFixed(0)}%</div></div></div>`;
  };
  ['eq','rp','ep','sp'].forEach(id=>{const e=$('#'+id); if(e) e.addEventListener('input',calc);});
  calc();
}

/* ============================ render ============================ */
const VIEWS={overview:viewOverview,macro:viewMacro,direction:viewDirection,
             rotation:viewRotation,movers:viewMovers,flow:viewFlow,rank:viewRank,
             vcp:viewVcp,kova:viewKova,discipline:viewDiscipline,proof:viewProof};

function renderNav(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    TAB=b.dataset.t; location.hash=TAB; renderNav(); renderBody();});
}
function renderBody(){
  if(!SNAP) return;
  try{ $('#app').innerHTML=VIEWS[TAB](SNAP); }
  catch(e){ $('#app').innerHTML=`<div class="notice">渲染 ${TAB} 出错：${esc(e.message)}</div>`; }
  if(TAB==='discipline') bindSizer();
}
function renderStamp(){
  $('#stamp').textContent='快照 '+(SNAP.generated_at_local||SNAP.generated_at||'—');
  const age=(Date.now()-new Date(SNAP.generated_at).getTime())/60000;
  const f=$('#freshness');
  const mode=(SNAP.meta&&SNAP.meta.mode==='public')?'公开实例':'完整实例';
  if(age<90){ f.className='pill live'; f.textContent=`${mode} · ${Math.round(age)} 分钟前`; }
  else{ f.className='pill stale'; f.textContent=`${mode} · ${(age/60).toFixed(1)} 小时前`; }
}
async function load(){
  try{
    const r=await fetch('./snapshot.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    SNAP=await r.json();
  }catch(e){
    $('#app').innerHTML=`<div class="notice">无法载入 snapshot.json：${esc(e.message)}<br>
      如果是刚部署，等待 GitHub Actions 首次运行生成快照。</div>`; return;
  }
  /* 私有层：只有本地/VM 实例才有这个文件，公开站点 404 后静默忽略 */
  try{ const p=await fetch('./private.json?t='+Date.now(),{cache:'no-store'});
       if(p.ok) PRIV=await p.json(); }catch(e){}
  renderStamp(); renderNav(); renderBody();
}
/* ==================== refresh: 真·重新采集 vs 只重取快照 ====================
   私有实例（Oracle VM）后面挂了 peter-refreshd，POST /api/refresh 会真的重跑
   collect.py 去拉最新行情；公开站点是 GitHub Pages 静态托管，没有后端，
   自动降级成「重新拉取最新快照文件」（快照由 Actions 定时重算）。          */
let HAS_API   = false;   // 是否存在真采集后端
let BUSY      = false;

function setBtn(txt, busy){
  const b=$('#refresh'); if(!b) return;
  b.textContent=txt; b.disabled=!!busy;
}
function idleLabel(){ return HAS_API ? '重新采集' : '刷新'; }
function idleTitle(){
  return HAS_API
    ? '真的重跑一次数据采集：抓最新行情 → 重算全部模块 → 刷新页面（约 20–40 秒）'
    : '公开站点是静态快照（由 GitHub Actions 定时重算）；此按钮重新拉取最新快照文件';
}
function resetBtn(){ setBtn(idleLabel(), false); const b=$('#refresh'); if(b) b.title=idleTitle(); }

async function apiState(){
  try{
    const r=await fetch('./api/refresh?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return null;
    const ct=r.headers.get('content-type')||'';
    if(!ct.includes('json')) return null;      // 静态站返回的是 404.html
    return await r.json();
  }catch(e){ return null; }
}

async function waitForRun(deadline){
  while(Date.now()<deadline){
    await new Promise(r=>setTimeout(r,2500));
    const st=await apiState();
    if(!st) return null;
    if(st.state!=='running') return st;
    const secs=Math.round((Date.now()-deadline+150000)/1000);
    setBtn(`采集中 ${secs}s…`, true);
  }
  return null;
}

async function doRefresh(){
  if(BUSY) return;
  BUSY=true;
  try{
    if(HAS_API){
      let res=null;
      try{ res=await fetch('./api/refresh',{method:'POST',cache:'no-store'}); }catch(e){ res=null; }
      if(res && res.status===429){
        const st=await res.json().catch(()=>({}));
        setBtn(`稍等 ${st.retry_after||10}s`, true);
        await new Promise(r=>setTimeout(r,1500));
      }else if(res && res.ok){
        setBtn('采集中…', true);
        const st=await waitForRun(Date.now()+150000);
        if(st && st.rc!==0 && st.error){
          setBtn('采集失败', true);
          $('#freshness').className='pill stale';
          $('#freshness').textContent='采集失败：'+String(st.error).slice(0,60);
          await new Promise(r=>setTimeout(r,2500));
        }
      }else{
        HAS_API=false;                          // 后端不在（静态托管）
      }
    }
    setBtn('载入中…', true);
    await load();
  } finally {
    BUSY=false; resetBtn();
  }
}

TAB=(location.hash||'#overview').slice(1); if(!VIEWS[TAB]) TAB='overview';
$('#refresh').onclick=doRefresh;
load();
setInterval(()=>{ if(!BUSY) load(); },120000);
/* 探测一次后端是否存在，决定按钮文案 */
apiState().then(st=>{ HAS_API=!!st; resetBtn(); });
</script>
</body>
